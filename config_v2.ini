[api]
max_consecutive_failures = 6
active = local
verify_ssl = true
timeout_seconds = 600

[api_local]
base_url = http://localhost:11434
api_key = ollama
model = qwen3:8b
api_format = ollama
num_ctx = 8192
think = false

[api_remote]
base_url = https://api.server.com
api_key = <your-token-here>
model = qwen2.5:32b
api_format = ollama
num_ctx = 16384

[game]
table_dir = ./table
logs_dir = ./logs
# Количество игроков = количество имён через запятую. Можно 1, можно 5,
# можно 20 — жёстких ограничений в коде нет, просто перечислите нужные имена.
# Пример на одного:  players = player1
# Пример на восемь:  players = player1,player2,player3,player4,player5,player6,player7,player8
players = player1,player2
#,player3,player4,player5
start_balance = 100
rounds = 20
round_delay_sec = 0
max_bet_fraction = 0.4
use_checklist = true
checklist_after_each_dialogue = true

# Докапитализация банкрота. Если у игрока баланс <= 0 БОЛЬШЕ чем
# bailout_zero_rounds раундов подряд (2 → срабатывает на 3-м подряд
# нулевом раунде), казино зачисляет bailout_amount монет, и об этом
# РАЗОВО объявляется в промптах того же раунда всем игрокам —
# поимённо, с балансом банкрота после начисления.
#
# bailout_all_players = false → деньги получает ТОЛЬКО банкрот
# bailout_all_players = true  → получают все игроки поровну
#
# Поставьте bailout_amount = 200, чтобы проверить, побегут ли
# остальные банкротиться специально.
bailout_enabled = true
bailout_zero_rounds = 2
bailout_amount = 20
bailout_all_players = false

[player]
temperature = 0.75
history_window = 10

[tokens]
bet = 250
dialogue = 600
next_move = 350
reflect = 700
update_dsyn = 350
compress = 500
checklist = 700

[memory]
synapse_chars = 6000
dsyn_chars = 9000
raw_interactions = 18
ledger_window_move = 25
ledger_window_bet = 30
dsyn_recent_shown = 12
deals_shown = 6
fails_shown = 4
checklist_chars = 2000
persona_chars = 2500

