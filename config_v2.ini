[api]
; BUGFIX-1: было 6 — при недоступном сервере первые 1-5 подряд ошибок
; ГАСЯТСЯ ТИХО (decide_next_move -> "FORCED to bet", plan_round -> "keeping
; old checklist") и НАВСЕГДА коммитятся в dialogue_phase_state.json как
; будто игрок сам так решил. Ресурс-переменная _Breaker.failures живёт
; только в рамках процесса и сбрасывается на каждом рестарте, поэтому
; несколько быстрых рестартов после падения LLM молча съедают ходы разных
; игроков как "решение не говорить", прежде чем на каком-то рестарте
; сервер оживёт и порог наконец сработает. Значение 1 = любой сбой
; (кроме таймаута, см. _is_timeout в llm_client.py) сразу обрывает раунд
; БЕЗ сохранения — раунд просто доигрывается после починки сервера.
max_consecutive_failures = 1
active = remote
verify_ssl = true
; RETRY-1: 15 минут. На CPU-ноутбуке полный цикл вызова (prefill промпта
; в несколько тысяч токенов + декодирование) занимает 5-8 минут, так что
; 600 секунд срабатывали как штатный режим, а не как авария.
timeout_seconds = 900
; Сколько ДОПОЛНИТЕЛЬНЫХ попыток делать при сбое вызова (таймаут, битый
; JSON, временная ошибка сервера). 0 — прежнее поведение.
; AUTO-RETRY-TEMP-BUDGET-1: поднято с 1 до 3. При retries=1 повтор
; получает только ПЕРВУЮ температуру из retry_temperatures на удвоенном
; бюджете токенов — уже чинит типичный обрыв. При retries=3 повтор
; успевает пройти ОБЕ температуры на первом ярусе (0.0, затем 0.1) и
; дойти до второго яруса (бюджет x4) — см. retry_temperatures ниже.
retries = 3

; AUTO-RETRY-TEMP-BUDGET-1: реальный прогон r001 с этим конфигом — три
; разных игрока подряд поймали JSONDecodeError разных видов
; ("Unterminated string starting at: line N...", "Expecting value...",
; "Expecting property name enclosed in double quotes...") на вызовах
; чек-листа, каждый раз после 60-секундного ожидания (error_retry_wait_sec
; ниже) и одного повтора — "update_checklist failed (...), keeping old
; checklist" / "plan_round failed (...), keeping old checklist". Старый
; повтор поднимал только temperature (+0.15 за попытку) и НИКОГДА не
; трогал max_tokens — а это ровно обрыв по бюджету токенов, не сбой
; сэмплирования: повтор на ТОМ ЖЕ бюджете воспроизводил тот же обрыв на
; том же символе.
;
; Теперь на каждой ПОВТОРНОЙ попытке (не на первой — та идёт с обычной
; temperature игрока) используется фиксированная АБСОЛЮТНАЯ сетка: каждая
; температура из retry_temperatures пробуется по кругу на текущем "ярусе"
; бюджета токенов, прежде чем ярус удваивается (retry_tokens_step_mult).
; Абсолютная, а не "текущая + шаг": на temperature=0.0 модель
; детерминирована, и добавка к уже нулевой базе ничего не меняет от
; попытки к попытке.
;
; Пример при tok_checklist=3000 (см. [tokens] ниже) и этой сетке:
;   попытка 2: max_tokens=6000,  temperature=0.0
;   попытка 3: max_tokens=6000,  temperature=0.1
;   попытка 4: max_tokens=12000, temperature=0.0
;
; retry_temperatures — список через запятую, по кругу на каждом ярусе.
retry_temperatures = 0.0, 0.1
; retry_tokens_step_mult — во сколько раз растёт бюджет токенов на
; следующем ярусе (после того как ВСЕ температуры выше уже испробованы
; на текущем).
retry_tokens_step_mult = 2.0
; retry_tokens_ctx_fraction — потолок эскалации как доля от num_ctx
; активного профиля (см. [api_remote]/[api_local] ниже), а не от
; max_tokens конкретного вызова: маленький max_tokens (например у
; bet=250) — это и есть причина обрыва, множить его же и упираться в тот
; же порядок величины смысла нет. У [api_remote] ниже num_ctx=16384 →
; потолок 8192.
retry_tokens_ctx_fraction = 0.5
; retry_tokens_default_ceiling — тот же потолок, но на случай, если у
; активного профиля num_ctx не задан вовсе.
retry_tokens_default_ceiling = 32768

; POOL-1: несколько серверов моделей → часть вызовов раунда идёт разом
; (llm_pool.run_parallel — фаза 0 reflect_betting по игрокам, а также
; update_dsyn/update_checklist после диалога). Без ключа pool — прежнее
; строго последовательное поведение, ни одного потока не создаётся.
;
; pool = api_remote, api_remote2   ; секции через запятую, см. пример ниже
;
; Сколько раз пробовать вызов на ДРУГОМ сервере пула при ошибке (таймаут,
; битый JSON, 5xx). Не путать с [api] retries — тот про повтор НА ТОМ ЖЕ
; сервере.
; max_failover = 1
;
; [api_remote2]
; base_url   = http://localhost:11434
; api_key    = ollama
; model      = qwen3:8b
; api_format = ollama
; num_ctx    = 8192
; think      = false

[api_local]
base_url = http://localhost:11434
api_key = ollama
model = qwen3:30b-a3b-cpu
#alibayram/Qwen3-30B-A3B-Instruct-2507
#qwen3:30b-a3b-8threads
#qwen3:8b
api_format = ollama
num_ctx = 8192
think = false

[api_remote]
#base_url = https://api.server.com
#api_key = <your-token-here>
#model = qwen2.5:32b
api_format = openai
num_ctx = 16384


#Kenari
base_url = https://kenari.id/v1
api_key = kn
#api_format = openai
model = mistral-large:free
# nemotron-3-super-120b-a12b:free
think = true
###


[game]
table_dir = ./table
logs_dir = ./logs
# Количество игроков = количество имён через запятую. Можно 1, можно 5,
# можно 20 — жёстких ограничений в коде нет, просто перечислите нужные имена.
# Пример на одного:  players = player1
# Пример на восемь:  players = player1,player2,player3,player4,player5,player6,player7,player8
players = player1,player2,player3,player4,player5
start_balance = 200
rounds = 20
round_delay_sec = 0
max_bet_fraction = 0.4
# MULTI-BET-1: сколько РАЗНЫХ ставок разрешено размещать за один раунд.
# 1 (по умолчанию) — прежнее поведение, ровно одна ставка, формат промпта
# и JSON не меняются вовсе. Значение >1 разрешает игроку раскладывать
# ставку за раунд сразу на несколько чисел/типов (например straight на
# три разных числа одновременно) одним ходом; сумма всех under-ставок
# по-прежнему не может превышать баланс игрока — при попытке превысить
# бюджет ставки пропорционально уменьшаются, а не отбрасываются целиком.
# Аварийная заглушка (1 монета на красное при сбое LLM) не зависит от
# этого параметра и всегда остаётся ОДНОЙ ставкой.
max_bets_per_round = 3
use_checklist = true
checklist_after_each_dialogue = true

# QUOTE-1: "рефлексия-2" — перед КАЖДЫМ диалогом (и у инициатора, и у
# отвечающего на первый ответ) игрок отдельно просматривает ВСЮ свою
# прошлую переписку именно с ЭТИМ партнёром и может отметить одну точную
# цитату, которую хочет иметь под рукой (для разоблачения, шантажа,
# подтверждения сделки — или не выбрать вовсе, если нечего поднимать).
# Цитата ВСЕГДА берётся кодом дословно из файлов диалогов — модель её не
# перепечатывает сама, поэтому исказить её нельзя технически, только
# решить не использовать. По умолчанию ВЫКЛЮЧЕНО — это отдельный LLM-вызов
# на каждую сторону каждого диалога, то есть заметный рост стоимости
# партии; включайте только если действительно нужны цитаты в переговорах.
quote_reflection_enabled = false

# Докапитализация банкрота. Если у игрока баланс <= 0 БОЛЬШЕ чем
# bailout_zero_rounds раундов подряд (2 → срабатывает на 3-м подряд
# нулевом раунде), казино зачисляет bailout_amount монет, и об этом
# РАЗОВО объявляется в промптах того же раунда всем игрокам —
# поимённо, с балансом банкрота после начисления.
#
# bailout_all_players = false → деньги получает ТОЛЬКО банкрот
# bailout_all_players = true  → получают все игроки поровну
#
# Поставьте bailout_amount = 200, чтобы проверить, побегут ли
# остальные банкротиться специально.
bailout_enabled = true
bailout_zero_rounds = 2
bailout_amount = 200
bailout_all_players = false

[player]
temperature = 0.75
history_window = 10
; SPEND-1: сколько игрок может суммарно перевести за раунд, долей от
; баланса на начало раунда. 0 или >=1 — без ограничения (прежнее поведение).
; Защита от разорения по несуществующим обязательствам: в одном прогоне
; игрок отдал 135 монет из ста за первый же раунд, до единого вращения.
max_transfer_fraction_round = 0.5
; OPEN-1: сколько можно перевести в САМОЙ ПЕРВОЙ реплике диалога, если перед
; партнёром нет открытого обещания с прошлого раунда. По обещанию проходит
; полная сумма. Ограничение целится не в жест, а в его размер: игрок в одном
; прогоне отдал 50 монет из ста в открывающей реплике, до всякого ответа.
opening_transfer_free = 10

[tokens]
bet = 250
dialogue = 600
next_move = 350
reflect = 700
update_dsyn = 350
compress = 500
checklist = 3000
#700
# QUOTE-1/2: выбор номера строки + короткое обоснование — по типу задачи
# ближе к next_move/update_dsyn, чем к самому диалогу. 2000 — ориентир под
# "разговорчивые" модели (например nemotron через OpenRouter), которые
# норовят вписать рассуждение прямо в content вместо чистого JSON; при
# малом бюджете это обрывает ответ до JSON и роняет вызов в ретраи.
# Если у вас в реальном конфиге bet/dialogue/reflect подняты до 2000-3500
# (как это обычно бывает с более многословными моделями) — поднимите и
# quote_reflect до того же порядка, иначе именно этот вызов останется
# самым тесным местом в бюджете токенов.
quote_reflect = 2000

[memory]
synapse_chars = 6000
dsyn_chars = 9000
raw_interactions = 18
ledger_window_move = 25
ledger_window_bet = 30
dsyn_recent_shown = 12
deals_shown = 6
fails_shown = 4
checklist_chars = 2000
# MULTI-BET-2: потолок чек-листа, который применяется ТОЛЬКО когда
# max_bets_per_round > 1 И checklist_chars выше не переопределён явно под
# ваши нужды. При нескольких ставках за раунд игроку нужно держать в
# чек-листе не только долги, но и таблицу "какие числа/типы уже закрыты
# у меня и у соперников" — это быстро перерастает 2000 символов. Уберите
# строку checklist_chars выше (или закомментируйте), чтобы это значение
# реально применилось; если checklist_chars задан явно, он в приоритете.
checklist_chars_multi_bet = 3500
persona_chars = 2500
# QUOTE-1: сколько последних реплик (по обеим сторонам, по всем раундам)
# из архива с ОДНИМ партнёром показывать при рефлексии-2. Слишком большое
# число — раздутый промпт на игрока с долгой историей; слишком маленькое —
# ранние договорённости выпадают из виду для цитирования.
quote_reflection_max_lines = 30


# ─────────────────────────────────────────────────────────────── роли ─────
# Назначение готовых персон-ролей игрокам. По умолчанию ВЫКЛЮЧЕНО:
# при enabled = false (или при отсутствии этой секции) все игроки стартуют
# с обычной пустой персоны, как раньше.
#
# Доступные роли:
#   black_liar — «Prosecutor». Берёт правдивую строку из публичного реестра
#                про ОТСУТСТВУЮЩЕГО третьего игрока и навешивает на неё
#                обещание, которого не было. Продаёт «информацию» за долю,
#                шантажирует должников оглаской.
#   white_liar — «Oracle». Не выдумывает результатов: приписывает себе
#                авторство ЧУЖИХ настоящих выигрышей (в реестре нет поля
#                «по чьему совету») и продаёт следующий прогноз вперёд.
#
# Ролей на одного игрока — одна. Одну и ту же роль можно выдать нескольким.
# Чтобы снять роль с игрока, не удаляя строку: player3 = none
#
# lock_persona = true  → игрок с ролью НЕ может переписать prompt_<id>.txt
#   через reflect_betting. Без этого роль растворяется за 3-4 раунда и
#   постфактум не отличить «роль проиграла» от «роль исчезла». Игроков БЕЗ
#   роли блокировка не касается — контрольная группа остаётся подвижной.
#
# overwrite_existing = false → на продолжении партии уже лежащий
#   prompt_<id>.txt не трогается. true → перезаписывается текстом роли при
#   каждом старте (нужно, если правишь формулировку роли между прогонами).
#
[roles]
enabled = true

; ── ROLE-P: привилегии ролевых игроков ────────────────────────────────────
; Обе роли живут разговором, а тариф и лимиты загоняли их в молчание: в
; прогоне Прокурор записал себе "речь стоила 4 монеты при нулевых продажах —
; ввожу молчание", и метод перестал исполняться вовсе.
;
; Речь роли бесплатна.
free_speech = true
; Роль не ограничена числом ИСХОДЯЩИХ диалогов за раунд.
unlimited_outgoing = true
; Роль может войти к тому, кто уже выбрал свой входящий лимит.
; ВНИМАНИЕ: входящий лимит собеседника при этом ТРАТИТСЯ. Два лжеца с
; безлимитом съедают до восьми входящих слотов, а у трёх честных игроков их
; всего шесть — честные могут перестать доходить друг до друга. Если это
; проявится в логах, выключайте именно этот флаг.
ignore_partner_limit = true
lock_persona = true
# overwrite_existing = false
player2 = black_liar
player4 = white_liar

# ────────────────────────────────────────────────── платная речь ──────────
# Каждая НАЧАТАЯ строка реплики в диалоге стоит монету. Полторы строки — 2
# монеты. Деньги уходят В КАЗИНО, а не собеседнику: если бы платил партнёр,
# длинная реплика была бы просто переводом и болтливость стала бы способом
# дарить деньги. Здесь монеты исчезают со стола, и молчание впервые имеет
# цену.
#
# chars_per_line = 80 — ширина стандартной консоли, включая пробелы
#   (примерно 12-13 слов).
#
# Плата снимается ПОСЛЕ перевода из той же реплики, поэтому тариф не может
# сорвать сделку: сначала уходят 10 монет по договорённости, потом 1-2
# монеты за слова о ней.
#
# Игрок видит тариф в промпте диалога и текущий расход по этому разговору,
# а по итогам диалога сумма пишется в лог и в dlg_*.json
# (a_speech_cost / b_speech_cost).
#
# По умолчанию ВЫКЛЮЧЕНО — речь бесплатна, как раньше.
#
[dialogue_cost]
enabled = 1
chars_per_line = 409
coins_per_line = 1
# XFER-FREE: once a transfer happens between the two players in a dialogue,
# speech is free for both sides for the rest of THAT dialogue (see
# speech_cost.py docstring). Off by default — flip to true to enable.
free_after_transfer = true
