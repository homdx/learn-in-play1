[api]
max_consecutive_failures = 6
active = local
verify_ssl = true
; RETRY-1: 15 минут. На CPU-ноутбуке полный цикл вызова (prefill промпта
; в несколько тысяч токенов + декодирование) занимает 5-8 минут, так что
; 600 секунд срабатывали как штатный режим, а не как авария.
timeout_seconds = 900
; Сколько ДОПОЛНИТЕЛЬНЫХ попыток делать при сбое вызова (таймаут, битый
; JSON, временная ошибка сервера). 0 — прежнее поведение.
retries = 1

; POOL-1: несколько серверов моделей → часть вызовов раунда идёт разом
; (llm_pool.run_parallel — фаза 0 reflect_betting по игрокам, а также
; update_dsyn/update_checklist после диалога). Без ключа pool — прежнее
; строго последовательное поведение, ни одного потока не создаётся.
;
; pool = api_remote, api_remote2   ; секции через запятую, см. пример ниже
;
; Сколько раз пробовать вызов на ДРУГОМ сервере пула при ошибке (таймаут,
; битый JSON, 5xx). Не путать с [api] retries — тот про повтор НА ТОМ ЖЕ
; сервере.
; max_failover = 1
;
; [api_remote2]
; base_url   = http://localhost:11434
; api_key    = ollama
; model      = qwen3:8b
; api_format = ollama
; num_ctx    = 8192
; think      = false

[api_local]
base_url = http://localhost:11434
api_key = ollama
model = qwen3:30b-a3b-cpu
#alibayram/Qwen3-30B-A3B-Instruct-2507
#qwen3:30b-a3b-8threads
#qwen3:8b
api_format = ollama
num_ctx = 8192
think = false

[api_remote]
base_url = https://api.server.com
api_key = <your-token-here>
model = qwen2.5:32b
api_format = ollama
num_ctx = 16384

[game]
table_dir = ./table
logs_dir = ./logs
# Количество игроков = количество имён через запятую. Можно 1, можно 5,
# можно 20 — жёстких ограничений в коде нет, просто перечислите нужные имена.
# Пример на одного:  players = player1
# Пример на восемь:  players = player1,player2,player3,player4,player5,player6,player7,player8
players = player1,player2,player3,player4,player5
start_balance = 100
rounds = 20
round_delay_sec = 0
max_bet_fraction = 0.4
use_checklist = true
checklist_after_each_dialogue = true

# Докапитализация банкрота. Если у игрока баланс <= 0 БОЛЬШЕ чем
# bailout_zero_rounds раундов подряд (2 → срабатывает на 3-м подряд
# нулевом раунде), казино зачисляет bailout_amount монет, и об этом
# РАЗОВО объявляется в промптах того же раунда всем игрокам —
# поимённо, с балансом банкрота после начисления.
#
# bailout_all_players = false → деньги получает ТОЛЬКО банкрот
# bailout_all_players = true  → получают все игроки поровну
#
# Поставьте bailout_amount = 200, чтобы проверить, побегут ли
# остальные банкротиться специально.
bailout_enabled = true
bailout_zero_rounds = 2
bailout_amount = 200
bailout_all_players = false

[player]
temperature = 0.75
history_window = 10
; SPEND-1: сколько игрок может суммарно перевести за раунд, долей от
; баланса на начало раунда. 0 или >=1 — без ограничения (прежнее поведение).
; Защита от разорения по несуществующим обязательствам: в одном прогоне
; игрок отдал 135 монет из ста за первый же раунд, до единого вращения.
max_transfer_fraction_round = 0.5
; OPEN-1: сколько можно перевести в САМОЙ ПЕРВОЙ реплике диалога, если перед
; партнёром нет открытого обещания с прошлого раунда. По обещанию проходит
; полная сумма. Ограничение целится не в жест, а в его размер: игрок в одном
; прогоне отдал 50 монет из ста в открывающей реплике, до всякого ответа.
opening_transfer_free = 10

[tokens]
bet = 250
dialogue = 600
next_move = 350
reflect = 700
update_dsyn = 350
compress = 500
checklist = 700

[memory]
synapse_chars = 6000
dsyn_chars = 9000
raw_interactions = 18
ledger_window_move = 25
ledger_window_bet = 30
dsyn_recent_shown = 12
deals_shown = 6
fails_shown = 4
checklist_chars = 2000
persona_chars = 2500


# ─────────────────────────────────────────────────────────────── роли ─────
# Назначение готовых персон-ролей игрокам. По умолчанию ВЫКЛЮЧЕНО:
# при enabled = false (или при отсутствии этой секции) все игроки стартуют
# с обычной пустой персоны, как раньше.
#
# Доступные роли:
#   black_liar — «Prosecutor». Берёт правдивую строку из публичного реестра
#                про ОТСУТСТВУЮЩЕГО третьего игрока и навешивает на неё
#                обещание, которого не было. Продаёт «информацию» за долю,
#                шантажирует должников оглаской.
#   white_liar — «Oracle». Не выдумывает результатов: приписывает себе
#                авторство ЧУЖИХ настоящих выигрышей (в реестре нет поля
#                «по чьему совету») и продаёт следующий прогноз вперёд.
#
# Ролей на одного игрока — одна. Одну и ту же роль можно выдать нескольким.
# Чтобы снять роль с игрока, не удаляя строку: player3 = none
#
# lock_persona = true  → игрок с ролью НЕ может переписать prompt_<id>.txt
#   через reflect_betting. Без этого роль растворяется за 3-4 раунда и
#   постфактум не отличить «роль проиграла» от «роль исчезла». Игроков БЕЗ
#   роли блокировка не касается — контрольная группа остаётся подвижной.
#
# overwrite_existing = false → на продолжении партии уже лежащий
#   prompt_<id>.txt не трогается. true → перезаписывается текстом роли при
#   каждом старте (нужно, если правишь формулировку роли между прогонами).
#
[roles]
enabled = true

; ── ROLE-P: привилегии ролевых игроков ────────────────────────────────────
; Обе роли живут разговором, а тариф и лимиты загоняли их в молчание: в
; прогоне Прокурор записал себе "речь стоила 4 монеты при нулевых продажах —
; ввожу молчание", и метод перестал исполняться вовсе.
;
; Речь роли бесплатна.
free_speech = true
; Роль не ограничена числом ИСХОДЯЩИХ диалогов за раунд.
unlimited_outgoing = true
; Роль может войти к тому, кто уже выбрал свой входящий лимит.
; ВНИМАНИЕ: входящий лимит собеседника при этом ТРАТИТСЯ. Два лжеца с
; безлимитом съедают до восьми входящих слотов, а у трёх честных игроков их
; всего шесть — честные могут перестать доходить друг до друга. Если это
; проявится в логах, выключайте именно этот флаг.
ignore_partner_limit = true
lock_persona = true
# overwrite_existing = false
player2 = black_liar
player4 = white_liar

# ────────────────────────────────────────────────── платная речь ──────────
# Каждая НАЧАТАЯ строка реплики в диалоге стоит монету. Полторы строки — 2
# монеты. Деньги уходят В КАЗИНО, а не собеседнику: если бы платил партнёр,
# длинная реплика была бы просто переводом и болтливость стала бы способом
# дарить деньги. Здесь монеты исчезают со стола, и молчание впервые имеет
# цену.
#
# chars_per_line = 80 — ширина стандартной консоли, включая пробелы
#   (примерно 12-13 слов).
#
# Плата снимается ПОСЛЕ перевода из той же реплики, поэтому тариф не может
# сорвать сделку: сначала уходят 10 монет по договорённости, потом 1-2
# монеты за слова о ней.
#
# Игрок видит тариф в промпте диалога и текущий расход по этому разговору,
# а по итогам диалога сумма пишется в лог и в dlg_*.json
# (a_speech_cost / b_speech_cost).
#
# По умолчанию ВЫКЛЮЧЕНО — речь бесплатна, как раньше.
#
[dialogue_cost]
enabled = true
chars_per_line = 409
coins_per_line = 1
