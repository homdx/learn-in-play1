# ════════════════════════════════════════════════════════════════════════════
# config_v2.ini — Casino v2 with LLM agents, dialogues, abstract prompts
#
# API: same format as jan-auto-agent (agents.ini)
# ════════════════════════════════════════════════════════════════════════════

[api]
active          = local
verify_ssl      = true
timeout_seconds = 120

[api_local]
# ── Ollama ──
base_url   = http://localhost:11434
api_key    = ollama
model      = qwen3:8b
api_format = ollama
num_ctx    = 8192
think      = false

# ── Jan (OpenAI-compatible) — uncomment to use ──
# base_url   = http://localhost:1337/v1
# api_key    = jan
# model      = qwen3-8b
# api_format = openai

[api_remote]
base_url   = https://api.server.com
api_key    = <your-token-here>
model      = qwen2.5:32b
api_format = ollama
num_ctx    = 16384

# ── game parameters ───────────────────────────────────────────────────────
[game]
table_dir        = ./table
logs_dir         = ./logs
players          = player1,player2,player3,player4,player5
start_balance    = 100
rounds           = 20
round_delay_sec  = 0
max_bet_fraction = 0.4

# ── player agent parameters ───────────────────────────────────────────────
[player]
temperature      = 0.75
max_tokens       = 600
history_window   = 10
