# config_v2_30b_pool.ini — РАБОЧИЙ пример POOL-1 для 30B-профиля: несколько
# разных серверов/моделей одновременно, вызовы параллелятся между ними.
#
# Пара к config_v2_pool.ini, только с таймаутами/токенами/памятью под 30B
# (как в config_v2_30b.ini). Ключ [api] pool НЕ закомментирован — впишите
# свои реальные base_url/model ниже, вслепую этот файл не запустится.
#
# Что реально параллелится (см. llm_pool.py): фаза 0 reflect_betting по
# игрокам, update_dsyn и update_checklist после диалога — диалоги и ставки
# как были последовательными, так и остаются.

[api]
; BUGFIX-1 НЕ применяем тут в 1: в pool-режиме падение ОДНОГО эндпоинта —
; штатная ситуация, для неё есть max_failover ниже (переход на другой
; сервер пула). _Breaker глобален на ВСЕ эндпоинты сразу (см.
; llm_pool.py PooledClient._call), поэтому max_consecutive_failures=1
; рвёт раунд на первом сбое ОДНОГО сервера, не дав failover сработать —
; де-факто отключает max_failover. Держим порог выше, чтобы пул успел
; выбрать другой сервер; тихая заглушка (BUGFIX-1) здесь менее вероятна,
; т.к. большинство сбоёв одного эндпоинта failover гасит незаметно.
max_consecutive_failures = 6
active = local
verify_ssl = true
timeout_seconds = 1800
retries = 2
; HTTP-RETRY: сбой С КОДОМ ОШИБКИ от сервера (402 "кончились кредиты",
; 429 сверх своей отдельной обработки, 5xx) — подождать и повторить ТОТ ЖЕ
; запрос без изменений. error_retries попыток по error_retry_wait_sec
; секунд каждая (по умолчанию 2 попытки × 60 сек). Не спасает от реально
; исчерпанной месячной квоты HF (та не появится снова через 2 минуты), но
; не даёт ронять раунд на кратковременном сбое биллинга/сети на их стороне.
error_retries = 2
error_retry_wait_sec = 60

; Список секций пула через запятую — по числу реально доступных серверов.
pool = api_remote_hugging, api_local
#, api_remote2

; Повторов на ДРУГОМ сервере пула при ошибке вызова (не путать с retries
; выше — тот про повтор на ТОМ ЖЕ сервере).
max_failover = 1

; ── Сервер 1: локальный Ollama, тяжёлая модель ──────────────────────────
[api_local]
base_url   = http://localhost:11434
api_key    = ollama
model      = gemma4:26b-a4b-it-q4_K_M-8threads
# qwen3:30b-a3b-8threads
#akdengi/saiga-gemma2-7threads
#akdengi/saiga-gemma2
api_format = ollama
num_ctx    = 32768
think      = false

; ── Сервер 2: удалённый API, та же модель в 30B ─────────────────────────
[api_remote]
base_url   = http://192.168.1.104:11434
model      = qwen3:30b-a3b-instruct-2507-q4_K_M-6threads
#model      = akdengi/saiga-gemma2
api_key    = ollama
#xyqwen3:30b-a3b-cpu
api_format = ollama
num_ctx    = 32768
think      = false


; ── Сервер 3: второй удалённый хост, модель послабее как запасной ──────
; Разные модели в пуле — намеренно: запасной сервер послабее лучше, чем
; упавший раунд, если основной перегружен.
[api_remote2]
base_url   = https://api.second-server.com
api_key    = <your-token-here>
model      = qwen2.5:32b
api_format = ollama
num_ctx    = 16384


[api_remote_hugging]
; HuggingFace router — OpenAI-compatible endpoint, works with any
; text-generation model HF hosts/serves, incl. Qwen3-8B.
; Get a token at https://huggingface.co/settings/tokens (read scope is enough).
base_url = https://router.huggingface.co/v1
api_key = your_token_here
model = Qwen/Qwen3-8B
api_format = openai
num_ctx = 8192
; THINK-1: Qwen3 — hybrid thinking model. Без явного отключения тратит
; весь max_tokens на <think> и обрывается по 'length' с пустым content
; (см. LLM_DEBUG: reasoning_content не пустой, content == ''). false
; отправляется как chat_template_kwargs.enable_thinking=false — работает,
; если провайдер за router.huggingface.co это поле уважает (vLLM/SGLang
; делают). Если конкретный провайдер его игнорирует, тратьте либо
; провайдера, поддерживающего этот kwarg, либо не-thinking модель.
think = false



[game]
table_dir          = ./table
logs_dir           = ./logs
players            = player1,player2,player3,player4,player5
start_balance      = 100
rounds             = 20
round_delay_sec    = 0
max_bet_fraction   = 0.4
use_checklist      = true
checklist_after_each_dialogue = true

bailout_enabled     = true
bailout_zero_rounds = 2
bailout_amount      = 200
bailout_all_players = false

[player]
temperature               = 0.75
history_window            = 10
max_transfer_fraction_round = 0.5
opening_transfer_free     = 10

[tokens]
bet         = 500
dialogue    = 1200
next_move   = 700
reflect     = 1400
update_dsyn = 700
compress    = 1000
checklist   = 1400

[memory]
synapse_chars      = 8000
dsyn_chars         = 12000
raw_interactions   = 18
ledger_window_move = 25
ledger_window_bet  = 30
dsyn_recent_shown  = 12
deals_shown        = 6
fails_shown        = 4
checklist_chars    = 2500
persona_chars      = 3000

[roles]
enabled = true

free_speech          = true
unlimited_outgoing   = true
ignore_partner_limit = true
lock_persona         = true
player2 = black_liar
player4 = white_liar

[dialogue_cost]
enabled        = true
chars_per_line = 80
coins_per_line = 1
# XFER-FREE: once a transfer happens between the two players in a dialogue,
# speech is free for both sides for the rest of THAT dialogue (see
# speech_cost.py docstring). Off by default — flip to true to enable.
free_after_transfer = false
