# config_v2_30b.ini — оптимизирован под alibayram/Qwen3-30B-A3B-Instruct-2507
# (qwen3:30b-a3b-cpu в Ollama)
#
# Ключевые отличия от config_v2.ini:
#   num_ctx = 32768  — модель поддерживает 32k, не зажимаем в 8k
#   think = false    — явно, снижает вероятность thinking-only ответа
#   [tokens]         — удвоены: 30B дольше думает, в 700 токенов не влезает
#   timeout_seconds  — 1800 (30 мин): 30B на CPU ~8-12 мин на вызов
#   retries = 2      — третья попытка при битом JSON
#   [memory]         — synapse/dsyn/persona шире: 30B работает с длинным контекстом

[api]
max_consecutive_failures = 6
active = local
verify_ssl = true
timeout_seconds = 1800
retries = 2

[api_local]
base_url   = http://localhost:11434
api_key    = ollama
model      = qwen3:30b-a3b-cpu
api_format = ollama
num_ctx    = 32768
think      = false

[api_remote]
base_url   = https://api.server.com
api_key    = <your-token-here>
model      = alibayram/Qwen3-30B-A3B-Instruct-2507
api_format = openai
num_ctx    = 32768

[game]
table_dir          = ./table
logs_dir           = ./logs
players            = player1,player2,player3,player4,player5
start_balance      = 100
rounds             = 20
round_delay_sec    = 0
max_bet_fraction   = 0.4
use_checklist      = true
checklist_after_each_dialogue = true

bailout_enabled     = true
bailout_zero_rounds = 2
bailout_amount      = 200
bailout_all_players = false

[player]
temperature               = 0.75
history_window            = 10
max_transfer_fraction_round = 0.5
opening_transfer_free     = 10

[tokens]
bet         = 500
dialogue    = 1200
next_move   = 700
reflect     = 1400
update_dsyn = 700
compress    = 1000
checklist   = 1400

[memory]
synapse_chars      = 8000
dsyn_chars         = 12000
raw_interactions   = 18
ledger_window_move = 25
ledger_window_bet  = 30
dsyn_recent_shown  = 12
deals_shown        = 6
fails_shown        = 4
checklist_chars    = 2500
persona_chars      = 3000

[roles]
enabled = true

free_speech          = true
unlimited_outgoing   = true
ignore_partner_limit = true
lock_persona         = true
player2 = black_liar
player4 = white_liar

[dialogue_cost]
enabled        = true
chars_per_line = 80
coins_per_line = 1
