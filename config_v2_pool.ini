# config_v2_pool.ini — РАБОЧИЙ пример POOL-1: несколько разных серверов/
# моделей одновременно, вызовы параллелятся между ними.
#
# В отличие от config_v2.ini / config_v2_30b.ini здесь ключ [api] pool
# НЕ закомментирован — этот файл сразу поднимает пул, если у вас
# действительно запущено несколько эндпоинтов. Просто взять и запустить
# без правки base_url/model ниже нельзя: впишите свои реальные адреса.
#
# Что реально параллелится (см. llm_pool.py): фаза 0 reflect_betting по
# игрокам, update_dsyn и update_checklist после диалога — сами диалоги
# и ставки как были последовательными, так и остаются.
#
# Один сервер в pool = поведение как без пула вообще. Секций может быть
# сколько угодно — по числу реально доступных эндпоинтов, не по числу
# игроков (аренда идёт НА ВЫЗОВ, а не на агента).

[api]
; BUGFIX-1 НЕ применяем тут в 1: в pool-режиме падение ОДНОГО эндпоинта —
; штатная ситуация, для неё есть max_failover ниже (переход на другой
; сервер пула). _Breaker глобален на ВСЕ эндпоинты сразу (см.
; llm_pool.py PooledClient._call), поэтому max_consecutive_failures=1
; рвёт раунд на первом сбое ОДНОГО сервера, не дав failover сработать —
; де-факто отключает max_failover. Держим порог выше, чтобы пул успел
; выбрать другой сервер; тихая заглушка (BUGFIX-1) здесь менее вероятна,
; т.к. большинство сбоёв одного эндпоинта failover гасит незаметно.
max_consecutive_failures = 6
active = local
verify_ssl = true
timeout_seconds = 900
retries = 1

; Список секций пула через запятую. Каждая — отдельный сервер, у каждого
; могут быть свой URL, свой ключ и своя модель.
pool = api_local, api_local_8b
#, api_remote

; Сколько раз при ошибке вызова (таймаут, битый JSON, 5xx) пробовать
; повторить на ДРУГОМ сервере пула, прежде чем сдаться. Не путать с
; retries выше — тот про повтор на ТОМ ЖЕ сервере.
max_failover = 3

; ── Сервер 1: основная модель, локальный Ollama на порту по умолчанию ──
; ── Сервер 1: локальный Ollama, тяжёлая модель ──────────────────────────
[api_local]
base_url   = http://localhost:11434
api_key    = ollama
model      = akdengi/saiga-gemma2-7threads
#akdengi/saiga-gemma2
api_format = ollama
num_ctx    = 8192
think      = false

; ── Сервер 2: вторая локальная модель на ДРУГОМ порту того же Ollama ──
; (запускается отдельным инстансом: OLLAMA_HOST=127.0.0.1:11435 ollama serve)
[api_local_8b]
#base_url   = http://localhost:11435
#api_key    = ollama
#model      = qwen3:8b
base_url   = http://192.168.1.104:11434
model      = akdengi/saiga-gemma2-6threads
#akdengi/saiga-gemma2
api_format = ollama
num_ctx    = 8192
think      = false

; ── Сервер 3: удалённый API, отдельный физический хост ─────────────────
[api_remote]
base_url   = https://api.server.com
api_key    = <your-token-here>
model      = qwen2.5:32b
api_format = ollama
num_ctx    = 16384

[game]
table_dir = ./table
logs_dir = ./logs
players = player1,player2,player3,player4,player5
start_balance = 100
rounds = 20
round_delay_sec = 0
max_bet_fraction = 0.4
use_checklist = true
checklist_after_each_dialogue = true

bailout_enabled = true
bailout_zero_rounds = 2
bailout_amount = 200
bailout_all_players = false

[player]
temperature = 0.75
history_window = 10
max_transfer_fraction_round = 0.5
opening_transfer_free = 10

[tokens]
bet = 250
dialogue = 600
next_move = 350
reflect = 700
update_dsyn = 350
compress = 500
checklist = 700

[memory]
synapse_chars = 6000
dsyn_chars = 9000
raw_interactions = 18
ledger_window_move = 25
ledger_window_bet = 30
dsyn_recent_shown = 12
deals_shown = 6
fails_shown = 4
checklist_chars = 2000
persona_chars = 2500

[roles]
enabled = true
free_speech = true
unlimited_outgoing = true
ignore_partner_limit = true
lock_persona = true
player2 = black_liar
player4 = white_liar

[dialogue_cost]
enabled = true
chars_per_line = 409
coins_per_line = 1
# XFER-FREE: once a transfer happens between the two players in a dialogue,
# speech is free for both sides for the rest of THAT dialogue (see
# speech_cost.py docstring). Off by default — flip to true to enable.
free_after_transfer = false
